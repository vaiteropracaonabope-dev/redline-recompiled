name: ARM64 CPU compatibility

on:
  push:
    branches: [android-port]
  pull_request:
    branches: [android-port]
  workflow_dispatch:

jobs:
  arm64-header-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Compile ARM64 CPU compatibility smoke test
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          "$CC" --version
          "$CC" -std=c11 -Wall -Wextra -Werror -Iruntime -fsyntax-only tests/arm64_cpu_compile.c
          "$CC" -std=c11 -Wall -Wextra -Werror -Iruntime -fsyntax-only runtime/host_fs_posix.c tests/host_fs_posix.c
          "$CC" -std=c11 -Wall -Wextra -Werror -Iruntime -fsyntax-only runtime/file.c
          "$CC" -std=c11 -Wall -Wextra -Werror -Iruntime -fsyntax-only runtime/host_sync_posix.c tests/host_sync_posix.c
          "$CC" -std=c11 -Wall -Wextra -Werror -pthread -Iruntime -fsyntax-only runtime/host_thread_posix.c tests/host_thread_posix.c

  arm64-runtime-check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Compile ARM64 CPU runtime test
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iruntime tests/arm64_cpu_compile.c -o /tmp/arm64-cpu-test
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread -Iruntime runtime/host_fs_posix.c tests/host_fs_posix.c -o /tmp/host-fs-test
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread -Iruntime runtime/host_sync_posix.c tests/host_sync_posix.c -o /tmp/host-sync-test
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread -Iruntime runtime/host_sync_posix.c runtime/host_thread_posix.c tests/host_thread_posix.c -o /tmp/host-thread-test
      - name: Run ARM64 CPU runtime test
        run: /tmp/arm64-cpu-test
      - name: Run POSIX filesystem test
        run: /tmp/host-fs-test
      - name: Run POSIX synchronization test
        run: /tmp/host-sync-test
      - name: Run POSIX host thread test
        run: /tmp/host-thread-test

  windows-backend-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile Windows filesystem backend
        shell: cmd
        run: |
          cl /nologo /W3 /WX /c /Iruntime runtime\host_fs_win32.c /Fo:host-fs-backend.obj
          cl /nologo /W3 /WX /c /Iruntime tests\host_fs_win32.c /Fo:host-fs-test.obj
          cl /nologo /W3 /WX host-fs-backend.obj host-fs-test.obj /Fe:host-fs-win32-test.exe
          host-fs-win32-test.exe
          cl /nologo /W3 /D_CRT_SECURE_NO_WARNINGS /Iruntime /c runtime\file.c /Fo:file-hle.obj
          cl /nologo /W3 /c /Iruntime runtime\thread.c /Fo:thread-hle.obj
          cl /nologo /W3 /WX /c /Iruntime runtime\host_sync_win32.c /Fo:host-sync-backend.obj
          cl /nologo /W3 /WX /c /Iruntime tests\host_sync_win32.c /Fo:host-sync-test.obj
          cl /nologo /W3 /WX host-sync-backend.obj host-sync-test.obj synchronization.lib /Fe:host-sync-win32-test.exe
          host-sync-win32-test.exe
          cl /nologo /W3 /WX /c /Iruntime runtime\host_thread_win32.c /Fo:host-thread-backend.obj
          cl /nologo /W3 /WX /c /Iruntime tests\host_thread_posix.c /Fo:host-thread-test.obj
          cl /nologo /W3 /WX host-thread-backend.obj host-sync-backend.obj host-thread-test.obj synchronization.lib /Fe:host-thread-win32-test.exe
          host-thread-win32-test.exe
          cl /nologo /W3 /c /Iruntime runtime\thread.c /Fo:thread-hle.obj
